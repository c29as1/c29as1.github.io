<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Click the Box Game</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f4f4f4;
    }

    h1 {
      margin-top: 20px;
    }

    #gameArea {
      position: relative;
      width: 500px;
      height: 300px;
      margin: 20px auto;
      background: white;
      border: 2px solid black;
    }

    #box {
      position: absolute;
      width: 50px;
      height: 50px;
      background: red;
      cursor: pointer;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
    }
  </style>
</head>
<body>

  <h1>Click the Box!</h1>
  <p>Score: <span id="score">0</span></p>
  <p>Time Left: <span id="time">30</span> seconds</p>

  <button onclick="startGame()">Start Game</button>

  <div id="gameArea">
    <div id="box"></div>
  </div>

  <script>
    let score = 0;
    let timeLeft = 30;
    let timer;
    const box = document.getElementById("box");
    const gameArea = document.getElementById("gameArea");

    function randomPosition() {
      const maxX = gameArea.clientWidth - box.clientWidth;
      const maxY = gameArea.clientHeight - box.clientHeight;

      const x = Math.random() * maxX;
      const y = Math.random() * maxY;

      box.style.left = x + "px";
      box.style.top = y + "px";
    }

    box.onclick = function () {
      score++;
      document.getElementById("score").textContent = score;
      randomPosition();
    };

    function startGame() {
      score = 0;
      timeLeft = 30;
      document.getElementById("score").textContent = score;
      document.getElementById("time").textContent = timeLeft;

      randomPosition();

      clearInterval(timer);
      timer = setInterval(() => {
        timeLeft--;
        document.getElementById("time").textContent = timeLeft;

        if (timeLeft <= 0) {
          clearInterval(timer);
          alert("Game over! Your score: " + score);
        }
      }, 1000);
    }
  </script>

</body>
</html>
