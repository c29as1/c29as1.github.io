<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>


</head>
<body>
	<script>
		function setup() {
  createCanvas(400, 400);
  ellipseMode(CENTER)
  rectMode(CENTER)
}

function draw() {
  background(220);
  stroke(0,0,0)
  strokeWeight(3)
  fill(255)
  circle(75,75,90)
  circle(325,75,90)
  circle(200,200,300)
  circle(150,150,25)
  circle(250,150,25)

  ellipse(200,250,120,50)
  noStroke()
  fill(255)
  rect(200,235,150,50)

}
	</script>

</body>
</html>
