<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.11/lib/p5.min.js"></script>
</head>
<body>
<script>
  function setup(){
    createCanvas(4000,4000);
  }

  function draw() {

for(i=0; i<150; i++){
    for(let j = 0; j<150;j++){
      noStroke()
      let x = i * 5
      let y = j * 5
      rect(x,y,5)
      // rect(x,y,10)

      let d = dist(x,y, mouseX, mouseY)

      if (d < 50){
        fill("black")
      } else {
        fill("white")
      }

      }
    }
  }

</script>


</body>
</html>
